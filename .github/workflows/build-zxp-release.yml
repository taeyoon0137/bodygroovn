name: Build signed ZXP release

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Git ref or SHA to build
        required: true
        default: fix-ae26-gradient
      release-tag:
        description: Optional release tag. Defaults to ae26-gradient-fix-v<manifest-version>-<short-sha>
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-zxp:
    name: Build and draft-release signed ZXP
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.17.0

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build extension folder
        run: |
          $env:NODE_OPTIONS = "--openssl-legacy-provider"
          npm run build

      - name: Download Adobe ZXPSignCmd
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP "zxpsigncmd"
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $signer = Join-Path $toolDir "ZXPSignCmd.exe"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/master/ZXPSignCMD/4.1.3/x64/ZXPSignCmd.exe" `
            -OutFile $signer
          if (!(Test-Path $signer)) { throw "ZXPSignCmd.exe download failed" }
          "SIGNER=$signer" | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Sign ZXP and verify signature
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = [xml](Get-Content -Raw "build/CSXS/manifest.xml")
          $version = $manifest.ExtensionManifest.ExtensionBundleVersion
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Could not read ExtensionBundleVersion from manifest" }

          $fullSha = (git rev-parse HEAD).Trim()
          $shortSha = (git rev-parse --short=12 HEAD).Trim()
          $tag = "${{ inputs.release-tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "ae26-gradient-fix-v$version-$shortSha"
          }

          $baseName = "bodymovin-extension-ae26-gradient-fix-v$version-$shortSha"
          $zxpPath = Join-Path $PWD "$baseName.zxp"
          $shaPath = "$zxpPath.sha256"
          $certPath = Join-Path $env:RUNNER_TEMP "bodymovin-ae26-self-signed.p12"
          $certPassword = "bodymovin-ae26-gradient-fix"

          & $env:SIGNER -selfSignedCert US CA Vendit BodymovinAE26Fix $certPassword $certPath -validityDays 3650
          if ($LASTEXITCODE -ne 0) { throw "ZXPSignCmd selfSignedCert failed with exit code $LASTEXITCODE" }

          & $env:SIGNER -sign "build" $zxpPath $certPath $certPassword
          if ($LASTEXITCODE -ne 0) { throw "ZXPSignCmd sign failed with exit code $LASTEXITCODE" }

          & $env:SIGNER -verify $zxpPath -certinfo -skipOnlineRevocationChecks
          if ($LASTEXITCODE -ne 0) { throw "ZXPSignCmd verify failed with exit code $LASTEXITCODE" }

          $hash = (Get-FileHash $zxpPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zxpPath -Leaf)" | Set-Content -NoNewline -Path $shaPath

          @"
          Private draft release for a locally built bodymovin CEP extension with the AE26 gradient fix applied.

          Source commit: $fullSha
          Branch/input: ${{ inputs.source-ref }}
          Manifest version: $version
          Package: $(Split-Path $zxpPath -Leaf)
          SHA256: $hash

          Build notes:
          - Built with Node.js 18.17.0 using npm install --legacy-peer-deps and npm run build.
          - Packaged and signed as ZXP with Adobe ZXPSignCmd 4.1.3 x64.
          - Signed with a self-signed certificate generated during this workflow run.
          "@ | Set-Content -Path release-notes.md

          "RELEASE_TAG=$tag" | Out-File -Append -FilePath $env:GITHUB_ENV
          "ZXP_PATH=$zxpPath" | Out-File -Append -FilePath $env:GITHUB_ENV
          "SHA_PATH=$shaPath" | Out-File -Append -FilePath $env:GITHUB_ENV
          "SOURCE_SHA=$fullSha" | Out-File -Append -FilePath $env:GITHUB_ENV
          "BASE_NAME=$baseName" | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASE_NAME }}
          path: |
            ${{ env.ZXP_PATH }}
            ${{ env.SHA_PATH }}
          if-no-files-found: error

      - name: Create private draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $env:RELEASE_TAG --cleanup-tag --yes
          }
          gh release create $env:RELEASE_TAG `
            $env:ZXP_PATH `
            $env:SHA_PATH `
            --draft `
            --target $env:SOURCE_SHA `
            --title "bodymovin AE26 gradient fix ZXP ($env:BASE_NAME)" `
            --notes-file release-notes.md
