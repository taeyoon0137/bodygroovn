name: Develop CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: develop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signing-certificate-contract:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Exercise P12 loading and certificate assertions on current PowerShell
        run: |
          $password = 'bodygroovn-ci-certificate-contract'
          $certificatePath = Join-Path $env:RUNNER_TEMP contract-certificate.p12
          $rsa = [Security.Cryptography.RSA]::Create(2048)
          $subject = [Security.Cryptography.X509Certificates.X500DistinguishedName]::new('C=KR, S=Seoul, O=taeyoon0137, CN=taeyoon0137-bodygroovn')
          $request = [Security.Cryptography.X509Certificates.CertificateRequest]::new($subject, $rsa, [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.RSASignaturePadding]::Pkcs1)
          $notBefore = [DateTimeOffset]::UtcNow.AddMinutes(-1)
          $certificate = $request.CreateSelfSigned($notBefore, $notBefore.AddDays(1460))
          try {
            [IO.File]::WriteAllBytes($certificatePath, $certificate.Export([Security.Cryptography.X509Certificates.X509ContentType]::Pkcs12, $password))
            $fingerprint = $certificate.GetCertHashString([Security.Cryptography.HashAlgorithmName]::SHA256).ToLowerInvariant()
            ./scripts/release/verify-signing-certificate.ps1 -CertificatePath $certificatePath -CertificatePassword $password -ExpectedFingerprint $fingerprint
            try {
              ./scripts/release/verify-signing-certificate.ps1 -CertificatePath $certificatePath -CertificatePassword $password -ExpectedFingerprint ('0' * 64)
              throw 'The certificate verifier accepted an incorrect fingerprint.'
            } catch {
              if ($_.Exception.Message -eq 'The certificate verifier accepted an incorrect fingerprint.') { throw }
            }
          } finally {
            $certificate.Dispose()
            $rsa.Dispose()
          }
      - name: Sign and verify a fixture with pinned ZXPSignCmd
        env:
          SIGNER_URL: https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/fcee8de5537d2dd2ed3d91d5a495b7041155b280/ZXPSignCMD/4.1.3/x64/ZXPSignCmd.exe
          SIGNER_SHA256: ffc2223167225ce61d024eb463fc5ad1a1be16133f99ef334a646f7311916c98
          TIMESTAMP_AUTHORITY: http://timestamp.digicert.com/
        run: |
          $password = 'bodygroovn-ci-zxp-contract'
          $certificatePath = Join-Path $env:RUNNER_TEMP zxp-contract-certificate.p12
          $rsa = [Security.Cryptography.RSA]::Create(2048)
          $subject = [Security.Cryptography.X509Certificates.X500DistinguishedName]::new('C=KR, S=Seoul, O=taeyoon0137, CN=taeyoon0137-bodygroovn')
          $request = [Security.Cryptography.X509Certificates.CertificateRequest]::new($subject, $rsa, [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.RSASignaturePadding]::Pkcs1)
          $notBefore = [DateTimeOffset]::UtcNow.AddMinutes(-1)
          $certificate = $request.CreateSelfSigned($notBefore, $notBefore.AddDays(1460))
          try {
            [IO.File]::WriteAllBytes($certificatePath, $certificate.Export([Security.Cryptography.X509Certificates.X509ContentType]::Pkcs12, $password))
            $fingerprint = $certificate.GetCertHashString([Security.Cryptography.HashAlgorithmName]::SHA256).ToLowerInvariant()

            $signer = Join-Path $env:RUNNER_TEMP ZXPSignCmd.exe
            Invoke-WebRequest -Uri $env:SIGNER_URL -OutFile $signer
            if ((Get-Item $signer).Length -ne 4542464) { throw 'ZXPSignCmd byte length mismatch' }
            $actualSignerHash = (Get-FileHash $signer -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSignerHash -cne $env:SIGNER_SHA256) { throw "ZXPSignCmd SHA-256 mismatch: $actualSignerHash" }

            $payload = Join-Path $env:RUNNER_TEMP zxp-contract-payload
            New-Item -ItemType Directory -Path $payload | Out-Null
            New-Item -ItemType Directory -Path (Join-Path $payload CSXS) | Out-Null
            Copy-Item bundle/CSXS/manifest.xml (Join-Path $payload CSXS manifest.xml)
            [IO.File]::WriteAllText((Join-Path $payload index.html), '<!doctype html><title>bodygroovn signature contract</title>', [Text.UTF8Encoding]::new($false))
            $zxp = Join-Path $env:RUNNER_TEMP zxp-contract.zxp
            & $signer -sign $payload $zxp $certificatePath $password -tsa $env:TIMESTAMP_AUTHORITY
            if ($LASTEXITCODE -ne 0) { throw 'ZXPSignCmd fixture signing failed' }

            $verificationLog = Join-Path $env:RUNNER_TEMP zxp-contract-verify.txt
            "Configured timestamp authority: $env:TIMESTAMP_AUTHORITY" | Set-Content -Path $verificationLog -Encoding utf8NoBOM
            & $signer -verify $zxp -certInfo 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $verificationLog -Append
            if ($LASTEXITCODE -ne 0) { throw 'ZXPSignCmd fixture verification failed' }
            ./scripts/release/verify-zxp-signature.ps1 -ZxpPath $zxp -VerificationLogPath $verificationLog -ExpectedFingerprint $fingerprint
          } finally {
            $certificate.Dispose()
            $rsa.Dispose()
          }

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
          install: true
          cache: true
          github_token: ${{ github.token }}
      - name: Verify the exact mise toolchain
        run: node scripts/ci/check-toolchain.mjs
      - run: yarn install --immutable
      - name: Provenance and generated-source checks
        run: |
          yarn check:csinterface
          node scripts/check-provenance.mjs
          node scripts/check-generated.mjs
          node scripts/release/validate-ae-record.mjs release/ae-validation.example.json windows 2025 1 1 2 1
      - run: yarn version:check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn test:server
      - run: yarn build
      - name: Payload and removed-surface checks
        run: |
          node scripts/check-payload.mjs build/bodygroovn
          yarn check:removed
          git diff --exit-code

  node-17-runtime:
    name: Node 17 smoke (${{ matrix.archive }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: node-v17.7.1-linux-x64.tar.xz
            sha256: 6992cfba9d1d37293305a569a2aab049e3fbfa304410dbec8e55d58634811132
            executable: node-v17.7.1-linux-x64/bin/node
          - os: windows-latest
            archive: node-v17.7.1-win-x64.zip
            sha256: dfb952d4c741957ca5191b9b97ac62630de431d3962c088a935e78e988c3378c
            executable: node-v17.7.1-win-x64/node.exe
          - os: macos-15-intel
            archive: node-v17.7.1-darwin-x64.tar.gz
            sha256: 94bfec7b7c034da3b626de77b9c8e6ba26418b160e805fc8a8106fbb0b797355
            executable: node-v17.7.1-darwin-x64/bin/node
          - os: macos-15
            archive: node-v17.7.1-darwin-arm64.tar.gz
            sha256: d5bb0974a881e017a178b33dab1e90d1fe1e183602d1e86b62fed1e2ea1960a6
            executable: node-v17.7.1-darwin-arm64/bin/node
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
          install: true
          cache: true
          github_token: ${{ github.token }}
      - name: Verify the exact mise toolchain
        run: node scripts/ci/check-toolchain.mjs
      - run: yarn install --immutable
      - run: yarn build
      - name: Download and verify official Node archive
        shell: pwsh
        env:
          ARCHIVE: ${{ matrix.archive }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
        run: |
          $url = "https://nodejs.org/download/release/v17.7.1/$env:ARCHIVE"
          $destination = Join-Path $env:RUNNER_TEMP $env:ARCHIVE
          Invoke-WebRequest -Uri $url -OutFile $destination
          $actual = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:EXPECTED_SHA256) { throw "Node archive SHA-256 mismatch: $actual" }
          if ($env:ARCHIVE.EndsWith('.zip')) {
            Expand-Archive $destination -DestinationPath $env:RUNNER_TEMP
          } else {
            tar -xf $destination -C $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw "Could not extract $env:ARCHIVE" }
          }
      - name: Run bundled server under CEP Node
        shell: pwsh
        env:
          NODE17: ${{ runner.temp }}/${{ matrix.executable }}
        run: |
          & $env:NODE17 --version
          if ($LASTEXITCODE -ne 0) { throw "Node 17 executable failed" }
          & $env:NODE17 test/server/node17Smoke.cjs build/bodygroovn/server/main.js build/bodygroovn/server/pngWorker.js
          if ($LASTEXITCODE -ne 0) { throw "Node 17 smoke test failed" }
