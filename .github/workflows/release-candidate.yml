name: Build v6.0.0 release candidate

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bodygroovn-v6.0.0-candidate
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.release.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Activate the exact package manager toolchain
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          test "$(node --version)" = v24.19.0
          test "$(corepack --version)" = 0.35.0
          test "$(yarn --version)" = 4.18.0
      - run: yarn install --immutable
      - id: release
        name: Classify pending Changesets
        run: |
          yarn changeset status --output "$RUNNER_TEMP/changeset-status.json"
          node scripts/release/classify-changeset-release.mjs "$RUNNER_TEMP/changeset-status.json" "$GITHUB_OUTPUT"

  verify-only:
    needs: inspect
    if: needs.inspect.outputs.mode == 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Activate the exact package manager toolchain
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          test "$(node --version)" = v24.19.0
          test "$(corepack --version)" = 0.35.0
          test "$(yarn --version)" = 4.18.0
      - run: yarn install --immutable
      - name: Verify without creating a release
        run: |
          node scripts/check-provenance.mjs
          node scripts/check-generated.mjs
          yarn version:check
          yarn lint
          yarn typecheck
          yarn test
          yarn test:server
          yarn build
          node scripts/check-payload.mjs build/bodygroovn
          yarn check:removed
          git diff --exit-code

  candidate:
    needs: inspect
    if: needs.inspect.outputs.mode == 'release'
    runs-on: windows-latest
    environment: release-signing
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Activate the exact package manager toolchain
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          if ((node --version).Trim() -cne 'v24.19.0') { throw "Unexpected Node version" }
          if ((corepack --version).Trim() -cne '0.35.0') { throw "Unexpected Corepack version" }
          if ((yarn --version).Trim() -cne '4.18.0') { throw "Unexpected Yarn version" }
      - run: yarn install --immutable
      - name: Require a clean main checkout
        run: |
          if (git status --porcelain) { throw "Candidate checkout is not clean" }
      - name: Require the single approved pending release
        run: |
          $status = Join-Path $env:RUNNER_TEMP changeset-status.json
          yarn changeset status --output $status
          node scripts/release/assert-changeset-release.mjs $status
      - name: Create the isolated release commit
        run: |
          $triggerSha = (git rev-parse HEAD).Trim()
          yarn changeset version
          yarn version:sync
          yarn version:check
          node scripts/release/assert-version-contract.mjs 6.0.0
          node scripts/release/assert-release-diff.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "chore(release): v6.0.0"
          if ((git rev-parse HEAD^).Trim() -cne $triggerSha) { throw "Release parent is not the trigger SHA" }
          if ((git log -1 --pretty=%s).Trim() -cne 'chore(release): v6.0.0') { throw "Unexpected release commit subject" }
          "TRIGGER_SHA=$triggerSha" | Out-File -Append $env:GITHUB_ENV
      - name: Verify and build only the release tree
        run: |
          node scripts/check-provenance.mjs
          node scripts/check-generated.mjs
          yarn version:check
          yarn lint
          yarn typecheck
          yarn test
          yarn test:server
          yarn build
          node scripts/check-payload.mjs build/bodygroovn
          yarn check:removed
          git diff --exit-code
      - name: Run the release tree under CEP Node 17.7.1
        env:
          NODE17_ARCHIVE: node-v17.7.1-win-x64.zip
          NODE17_SHA256: dfb952d4c741957ca5191b9b97ac62630de431d3962c088a935e78e988c3378c
        run: |
          $archive = Join-Path $env:RUNNER_TEMP $env:NODE17_ARCHIVE
          Invoke-WebRequest -Uri "https://nodejs.org/download/release/v17.7.1/$env:NODE17_ARCHIVE" -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:NODE17_SHA256) { throw "Node 17 archive SHA-256 mismatch: $actual" }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          $node17 = Join-Path $env:RUNNER_TEMP node-v17.7.1-win-x64/node.exe
          & $node17 --version
          if ($LASTEXITCODE -ne 0) { throw 'Node 17 executable failed' }
          & $node17 test/server/node17Smoke.cjs build/bodygroovn/server/main.js build/bodygroovn/server/pngWorker.js
          if ($LASTEXITCODE -ne 0) { throw 'Node 17 release-tree smoke test failed' }
      - name: Download and authenticate ZXPSignCmd 4.1.3
        env:
          SIGNER_URL: https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/fcee8de5537d2dd2ed3d91d5a495b7041155b280/ZXPSignCMD/4.1.3/x64/ZXPSignCmd.exe
          SIGNER_SHA256: ffc2223167225ce61d024eb463fc5ad1a1be16133f99ef334a646f7311916c98
        run: |
          $signer = Join-Path $env:RUNNER_TEMP ZXPSignCmd.exe
          Invoke-WebRequest -Uri $env:SIGNER_URL -OutFile $signer
          if ((Get-Item $signer).Length -ne 4542464) { throw "ZXPSignCmd byte length mismatch" }
          $actual = (Get-FileHash $signer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:SIGNER_SHA256) { throw "ZXPSignCmd SHA-256 mismatch: $actual" }
          "SIGNER=$signer" | Out-File -Append $env:GITHUB_ENV
      - name: Decode and authenticate signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.ZXP_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.ZXP_CERTIFICATE_PASSWORD }}
          EXPECTED_FINGERPRINT: ${{ secrets.ZXP_SIGNING_CERT_FINGERPRINT_SHA256 }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP bodygroovn-release.p12
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          ./scripts/release/verify-signing-certificate.ps1 -CertificatePath $certificatePath -CertificatePassword $env:CERTIFICATE_PASSWORD -ExpectedFingerprint $env:EXPECTED_FINGERPRINT
          "CERTIFICATE_PATH=$certificatePath" | Out-File -Append $env:GITHUB_ENV
      - name: Sign, verify, and assemble immutable candidate
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.ZXP_CERTIFICATE_PASSWORD }}
          CERTIFICATE_FINGERPRINT: ${{ secrets.ZXP_SIGNING_CERT_FINGERPRINT_SHA256 }}
          TIMESTAMP_AUTHORITY: http://timestamp.digicert.com/
        run: |
          $candidate = Join-Path $PWD candidate
          New-Item -ItemType Directory -Path $candidate | Out-Null
          $zxp = Join-Path $candidate bodygroovn-v6.0.0.zxp
          & $env:SIGNER -sign build/bodygroovn $zxp $env:CERTIFICATE_PATH $env:CERTIFICATE_PASSWORD -tsa $env:TIMESTAMP_AUTHORITY
          if ($LASTEXITCODE -ne 0) { throw "ZXPSignCmd sign failed" }
          $verifyLog = Join-Path $candidate zxp-verify.txt
          "Configured timestamp authority: $env:TIMESTAMP_AUTHORITY" | Set-Content -Path $verifyLog -Encoding utf8NoBOM
          & $env:SIGNER -verify $zxp -certInfo 2>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath $verifyLog -Append
          if ($LASTEXITCODE -ne 0) { throw "ZXPSignCmd verify failed" }
          ./scripts/release/verify-zxp-signature.ps1 -ZxpPath $zxp -VerificationLogPath $verifyLog -ExpectedFingerprint $env:CERTIFICATE_FINGERPRINT
          node scripts/write-sha256-sidecar.mjs $zxp "$zxp.sha256"
          node scripts/verify-sha256-sidecar.mjs $zxp "$zxp.sha256"
          Copy-Item build/unsigned-payload-manifest.json $candidate
          git update-ref refs/bodygroovn/release-candidate HEAD
          git bundle create (Join-Path $candidate bodygroovn-v6.0.0.git.bundle) refs/bodygroovn/release-candidate
          if ($LASTEXITCODE -ne 0) { throw "git bundle creation failed" }
          node scripts/release/write-provenance.mjs $candidate $env:TRIGGER_SHA $env:GITHUB_RUN_ID $env:GITHUB_RUN_ATTEMPT $env:CERTIFICATE_FINGERPRINT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-v6.0.0-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/*
          if-no-files-found: error
          retention-days: 90
          overwrite: false
