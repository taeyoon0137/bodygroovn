name: Validate v6.0.0 candidate in After Effects

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Release candidate workflow run ID
        required: true
        type: string
      candidate_run_attempt:
        description: Release candidate workflow run attempt
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bodygroovn-v6.0.0-ae-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
  cancel-in-progress: false

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            ae: '2025'
            runner: bodygroovn-windows-ae2025
          - os: windows
            ae: '2026'
            runner: bodygroovn-windows-ae2026
          - os: macos
            ae: '2025'
            runner: bodygroovn-macos-ae2025
          - os: macos
            ae: '2026'
            runner: bodygroovn-macos-ae2026
    runs-on: [self-hosted, '${{ matrix.runner }}']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-candidate-v6.0.0-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}
          path: candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate and execute the host harness
        shell: pwsh
        env:
          BODYGROOVN_AE_HARNESS: ${{ vars.BODYGROOVN_AE_HARNESS }}
          VALIDATION_OS: ${{ matrix.os }}
          VALIDATION_AE: ${{ matrix.ae }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          VALIDATION_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node scripts/verify-sha256-sidecar.mjs candidate/bodygroovn-v6.0.0.zxp candidate/bodygroovn-v6.0.0.zxp.sha256
          if ([string]::IsNullOrWhiteSpace($env:BODYGROOVN_AE_HARNESS)) { throw "BODYGROOVN_AE_HARNESS is not configured" }
          $record = "ae-validation-$env:VALIDATION_OS-$env:VALIDATION_AE.json"
          $log = "ae-validation-$env:VALIDATION_OS-$env:VALIDATION_AE.log"
          & $env:BODYGROOVN_AE_HARNESS --zxp candidate/bodygroovn-v6.0.0.zxp --record $record --log $log --schema release/ae-validation.schema.json
          if ($LASTEXITCODE -ne 0) { throw "AE validation harness failed" }
          node scripts/release/validate-ae-record.mjs $record $env:VALIDATION_OS $env:VALIDATION_AE $env:CANDIDATE_RUN_ID $env:CANDIDATE_RUN_ATTEMPT $env:VALIDATION_RUN_ID $env:VALIDATION_RUN_ATTEMPT $log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ae-validation-${{ matrix.os }}-${{ matrix.ae }}-${{ inputs.candidate_run_id }}-${{ inputs.candidate_run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ae-validation-${{ matrix.os }}-${{ matrix.ae }}.json
            ae-validation-${{ matrix.os }}-${{ matrix.ae }}.log
          if-no-files-found: error
          retention-days: 90
          overwrite: false
